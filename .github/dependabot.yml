version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The Claude Code release CI checks against. The hooks API can change
  # between releases, so each new release arrives as a pull request whose
  # checks show whether the plugin still works with it; merging it moves the
  # pin.
  - package-ecosystem: npm
    directory: /.github/ci
    schedule:
      interval: weekly
  # requirements.txt pins every package by hash, so an update that brings in
  # a new dependency fails to install until that dependency is added by hand.
  # python-dateutil 4 adds tzdata, and strictyaml needs only 2.6 or later.
  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: weekly
    groups:
      skills-ref:
        patterns: ['*']
    ignore:
      - dependency-name: python-dateutil
        update-types: ['version-update:semver-major']
