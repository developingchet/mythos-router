version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The Claude Code release CI checks against. The hooks API can change
  # between releases, so each new release arrives as a pull request whose
  # checks show whether the plugin still works with it; merging it moves the
  # pin.
  - package-ecosystem: npm
    directory: /.github/ci
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: weekly
    groups:
      skills-ref:
        patterns: ['*']
