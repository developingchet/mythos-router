name: Compatibility

# The hooks API the plugin uses is in early access and may change between
# Claude Code releases without notice. Each week this runs the checks against
# the newest releases on npm's `latest` and `next` tags. A failure emails the
# repository owner, as any failed scheduled run does; the pinned release in
# .github/ci moves forward once a newer one passes.

on:
  schedule:
    - cron: '23 7 * * 1' # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  DISABLE_AUTOUPDATER: '1'

defaults:
  run:
    shell: bash

jobs:
  compat:
    name: compat (${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, next]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code ${{ matrix.channel }}
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          npm install --prefix "$RUNNER_TEMP/claude" --no-audit --no-fund "@anthropic-ai/claude-code@$CHANNEL"
          echo "$RUNNER_TEMP/claude/node_modules/.bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: claude plugin validate --strict .
      - run: claude plugin test .
