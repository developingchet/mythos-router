name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # from release.yml, so a tag is released only once its commit passes

permissions:
  contents: read

env:
  DISABLE_AUTOUPDATER: '1'

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The Claude Code release the plugin is checked against, pinned by
      # .github/ci/package-lock.json.
      - name: Install Claude Code
        run: |
          npm ci --prefix .github/ci --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/ci/node_modules/.bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: claude plugin validate --strict .
      - run: claude plugin test .

  skills:
    name: skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # The Agent Skills reference validator, pinned by hash with its
      # dependencies in .github/ci/requirements.txt.
      - name: Install skills-ref
        run: pip install --no-cache-dir --only-binary :all: --require-hashes -r .github/ci/requirements.txt
      - name: Validate every skill
        run: |
          for skill in skills/*/; do
            skills-ref validate "$skill"
          done
